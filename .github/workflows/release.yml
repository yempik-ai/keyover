name: Release

# Publishing a GitHub release publishes that version to npm, with provenance,
# once the repository variable NPM_PUBLISH is "true". The job authenticates as
# the package's npm trusted publisher (OIDC): the relationship on npmjs.com
# names this repository and this file, so the repository stores no npm token.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: npm publish --provenance --access public
