name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  library:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The built package fails over, and the CLI answers, on this Node.
      - run: node scripts/smoke.mjs
      - run: node dist/cli.js --help

  # The same built package on the other runtimes it claims.
  runtimes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: oven-sh/setup-bun@v2
      - run: bun scripts/smoke.mjs
      - uses: denoland/setup-deno@v2
      - run: deno run scripts/smoke.mjs

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter site typecheck
      - run: pnpm --filter site build
        env:
          NEXT_OUTPUT: export
